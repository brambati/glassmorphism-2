<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism 2.0</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fundo com blobs coloridos -->
  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Cards de glassmorphism -->
  <main class="cards">

    <article class="glass-card">
      <div class="card-icon">🚀</div>
      <h2>Performance</h2>
      <p>Sites que carregam em menos de 1s e marcam 100 no Lighthouse.</p>
      <a href="#" class="glass-btn">Saiba mais</a>
    </article>

    <article class="glass-card featured">
      <div class="card-icon">✨</div>
      <h2>Design</h2>
      <p>Interfaces que o usuário sente diferença antes mesmo de perceber.</p>
      <a href="#" class="glass-btn">Ver projetos</a>
    </article>

    <article class="glass-card">
      <div class="card-icon">⚡</div>
      <h2>Velocidade</h2>
      <p>Da ideia ao ar em dias — sem abrir mão de qualidade.</p>
      <a href="#" class="glass-btn">Começar</a>
    </article>

  </main>

</body>
</html>
